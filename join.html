<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đăng ký • PHOENIX Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card auth-card-wide">
      <div class="auth-brand">
        <span class="logo large">PHX</span>
        <div><span class="eyebrow">PHOENIX HUB</span><h1>Đăng ký thành viên.</h1></div>
      </div>

      <p class="auth-lead">UID game sẽ là tài khoản đăng nhập của bạn. Mỗi UID chỉ đăng ký một lần.</p>

      <form id="registerForm" class="join-form auth-form">
        <div class="auth-grid">
          <label>
            UID Free Fire
            <input id="registerUid" inputmode="numeric" autocomplete="username" required maxlength="24" placeholder="UID game">
          </label>

          <label>
            Tên ingame
            <input id="registerIngame" required maxlength="32" placeholder="VD: PHX.Louis">
          </label>
        </div>

        <label>
          Tên hiển thị
          <input id="registerDisplay" required maxlength="32" placeholder="Tên mọi người sẽ thấy trong Hub">
        </label>

        <label>
          Nhánh đang tham gia
          <select id="registerBranch" required>
            <option value="">Đang tải 3 nhánh...</option>
          </select>
        </label>

        <div class="auth-grid">
          <label>
            Mật khẩu
            <input id="registerPassword" type="password" autocomplete="new-password" minlength="6" maxlength="72" required placeholder="Tối thiểu 6 ký tự">
          </label>
          <label>
            Nhập lại mật khẩu
            <input id="registerPassword2" type="password" autocomplete="new-password" minlength="6" maxlength="72" required placeholder="Nhập lại mật khẩu">
          </label>
        </div>

        <button id="registerBtn" class="primary" type="submit">Tạo tài khoản & gửi BQT duyệt</button>
      </form>

      <div id="registerStatus" class="auth-status hidden"></div>
      <div id="registerError" class="error hidden"></div>

      <div class="auth-footer">
        <span>Đã có tài khoản?</span>
        <a href="login.html">Đăng nhập</a>
      </div>
    </section>
  </main>
  <script type="module" src="js/register.js"></script>
</body>
</html>
